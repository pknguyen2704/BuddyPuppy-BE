name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - master   # hoặc branch bạn muốn deploy

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v3

      # 2. Authenticate với Google Cloud bằng Service Account
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Cài đặt gcloud CLI
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.PROJECT_ID }}

      # 4. Login Docker với Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev --quiet

      # 5. Build và push image lên Artifact Registry (repo: buddypuppy)
      - name: Build and Push Docker image
        run: |
          IMAGE=${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/buddypuppy/backend:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # 6. Deploy lên Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend-service \
            --image $IMAGE \
            --region ${{ secrets.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars MONGO_URI=${{ secrets.MONGO_URI }}
